<!doctype HTML>
<html>
<head>
    <title>WebAR Custom Marker</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
  
<!-- set detectionMode and matrixCodeType to enable barcode marker detection and custom pattern files -->

<a-scene embedded vr-mode-ui="enabled: false;" arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets>
        <img id="grid" src="images/border.png" />
        <img id="earth-flat" src="images/earth-flat.jpg" />
        <img id="jupiter-sphere" src="images/jupiter_sphere.jpg" />
        <img id="semangka" src="images/semangka.jpg" />
    </a-assets>
    
    <a-marker type="pattern" url="data/kanji.patt">
        <a-box position="0 0.5 0" 
               material="color: yellow; transparent: true; opacity: 0.80;">
        </a-box>
    </a-marker>
    
    <a-marker type="barcode" value="0">
        <a-box position="0 0.5 0" 
               material="src: #grid; color: blue; transparent: true; opacity: 1;">
        </a-box>
    </a-marker>

    <a-marker type="barcode" value="1">
        <a-sphere position="0 0.5 0" 
               material="src: #semangka; transparent: true; opacity: 0.95;">
        </a-sphere>
    </a-marker>

    <a-marker type="barcode" value="2">
        <a-sphere position="0 0.5 0" 
               material="src: #jupiter-sphere; transparent: true; opacity: 0.95;">
        </a-sphere>
    </a-marker>
    
    <a-entity camera></a-entity>
    
</a-scene>
</body>
</html>
